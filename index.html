<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BSc CS Hub | Focus Mode</title>
    <style>
        /* ========================================
        DESIGN SYSTEM & GLOBAL STYLES
        ======================================== */
        :root {
            --p-color: #6366f1;
            --p-light: #818cf8;
            --bg-deep: #020617;
            --card-glass: rgba(30, 41, 59, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --safe-top: env(safe-area-inset-top);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ========================================
        MINIMALIST HEADER
        ======================================== */
        header {
            padding: calc(30px + var(--safe-top)) 20px 20px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-row h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        #live-clock { font-size: 13px; font-weight: 700; color: var(--p-light); }

        /* ========================================
        DAY SELECTOR (TOUCH-READY)
        ======================================== */
        .day-nav {
            display: flex; gap: 10px; overflow-x: auto;
            scrollbar-width: none; padding-bottom: 5px;
        }
        .day-nav::-webkit-scrollbar { display: none; }

        .day-tab {
            padding: 10px 24px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            color: var(--text-dim);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-tab.active {
            background: var(--p-color);
            color: white;
            border-color: var(--p-light);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        /* ========================================
        SCHEDULE DISPLAY ENGINE
        ======================================== */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .class-card {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: 80px 1fr auto;
            align-items: center;
            gap: 20px;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        /* Status Effects */
        .class-card.active-now {
            border: 1px solid var(--p-light);
            background: rgba(99, 102, 241, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .class-card.type-break {
            border-left: 5px solid var(--accent-gold);
            background: rgba(251, 191, 36, 0.05);
        }

        /* Card Content Styling */
        .time-col { 
            border-right: 1px solid var(--border-glass); 
            padding-right: 15px; 
            text-align: right;
        }
        .time-col .s { display: block; font-weight: 800; font-size: 17px; color: #fff; }
        .time-col .e { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

        .info h3 { font-size: 18px; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .info p { font-size: 13px; color: var(--text-dim); font-weight: 500; }

        .type-tag {
            font-size: 10px; font-weight: 900;
            padding: 5px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.08);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-break .type-tag { background: var(--accent-gold); color: #000; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-row">
            <h1>BSc CS <span style="color:var(--p-light)">Hub</span></h1>
            <div id="live-clock">--:--:--</div>
        </div>
        
        <div class="day-nav" id="tabs">
            </div>
    </header>

    <main id="scheduleRoot">
        </main>

    <script>
        /**
         * CORE ENGINE - REFINED FOR FOCUS MODE
         */
        const App = {
            db: {
                "Mon": [
                    { s: "09:00", e: "10:00", name: "DS", type: "Theory", prof: "VM", room: "VY502" },
                    { s: "10:00", e: "11:00", name: "DBMS", type: "Theory", prof: "MB", room: "VY502" },
                    { s: "11:00", e: "12:00", name: "BREAK", type: "Break", prof: "-", room: "Cafeteria" },
                    { s: "12:00", e: "14:00", name: "FCS Lab", type: "Lab", prof: "-", room: "VY528" },
                    { s: "14:00", e: "15:00", name: "Microprocessor", type: "Theory", prof: "VS", room: "VY504" }
                ],
                "Tue": [
                    { s: "09:00", e: "10:00", name: "DS", type: "Theory", prof: "VM", room: "VY502" },
                    { s: "10:00", e: "11:00", name: "Micro", type: "Theory", prof: "VS", room: "VY502" },
                    { s: "11:00", e: "12:00", name: "BREAK", type: "Break", prof: "-", room: "Cafeteria" },
                    { s: "12:00", e: "14:00", name: "DS Lab A1, A2", type: "Lab", prof: "VM", room: "VY428" },
                    { s: "14:00", e: "16:00", name: "Micro Lab A1", type: "Lab", prof: "-", room: "VY422" }
                ],
                "Wed": [
                    { s: "09:00", e: "10:00", name: "DS", type: "Theory", prof: "VM", room: "VY502" },
                    { s: "10:00", e: "11:00", name: "Peace", type: "Core", prof: "MK", room: "VY502" },
                    { s: "11:00", e: "12:00", name: "BREAK", type: "Break", prof: "-", room: "Cafeteria" },
                    { s: "12:00", e: "14:00", name: "Yoga", type: "Activity", prof: "-", room: "Ground" },
                    { s: "14:00", e: "16:00", name: "FCS Lab", type: "Lab", prof: "-", room: "VY427" }
                ],
                "Thu": [
                    { s: "09:00", e: "10:00", name: "DBMS", type: "Theory", prof: "MB", room: "VY502" },
                    { s: "10:00", e: "11:00", name: "Peace", type: "Core", prof: "MK", room: "VY502" },
                    { s: "11:00", e: "12:00", name: "BREAK", type: "Break", prof: "-", room: "Cafeteria" },
                    { s: "12:00", e: "14:00", name: "Micro Lab A2", type: "Lab", prof: "-", room: "VY422" }
                ],
                "Fri": [
                    { s: "08:00", e: "10:00", name: "IKS", type: "Theory", prof: "-", room: "VY502" },
                    { s: "10:00", e: "11:00", name: "DBMS", type: "Theory", prof: "MB", room: "VY502" },
                    { s: "11:00", e: "12:00", name: "BREAK", type: "Break", prof: "-", room: "Cafeteria" },
                    { s: "12:00", e: "14:00", name: "DBMS Lab A1, A2", type: "Lab", prof: "-", room: "VY426" },
                    { s: "14:00", e: "15:00", name: "Micro", type: "Theory", prof: "VS", room: "VY504" }
                ]
            },

            currentDay: "Mon",

            init() {
                const d = new Date();
                const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                const today = days[d.getDay()];
                
                // Fallback to Monday on weekends
                this.currentDay = (today === "Sun" || today === "Sat") ? "Mon" : today;
                
                this.updateUI();
                setInterval(() => {
                    const now = new Date();
                    document.getElementById('live-clock').innerText = now.toLocaleTimeString();
                    // Auto-refresh schedule highlighting every minute
                    if (now.getSeconds() === 0) this.renderSchedule();
                }, 1000);
            },

            updateUI() {
                this.renderTabs();
                this.renderSchedule();
            },

            renderTabs() {
                const container = document.getElementById('tabs');
                container.innerHTML = Object.keys(this.db).map(day => `
                    <div class="day-tab ${day === this.currentDay ? 'active' : ''}" 
                         onclick="App.setDay('${day}')">${day}</div>
                `).join('');
            },

            setDay(day) {
                this.currentDay = day;
                this.updateUI();
            },

            renderSchedule() {
                const root = document.getElementById('scheduleRoot');
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

                root.innerHTML = this.db[this.currentDay].map((item, idx) => {
                    const isActive = timeStr >= item.s && timeStr < item.e;
                    const isBreak = item.type === "Break";
                    
                    return `
                    <div class="class-card ${isActive ? 'active-now' : ''} ${isBreak ? 'type-break' : ''}" 
                         style="animation: fadeIn 0.4s ease forwards ${idx * 0.1}s">
                        <div class="time-col">
                            <span class="s">${item.s}</span>
                            <span class="e">${item.e}</span>
                        </div>
                        <div class="info">
                            <h3>${item.name}</h3>
                            <p>${item.prof !== '-' ? item.prof + ' • ' : ''}Room ${item.room}</p>
                        </div>
                        <div class="type-tag">${item.type}</div>
                    </div>
                `}).join('');
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
